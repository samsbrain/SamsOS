routines:
  - id: sunday_planning
    title: Plan the upcoming week
    domain: learning
    days:
      - sunday
    duration_minutes: 20

  - id: bjj_training
    title: BJJ training
    domain: fitness
    scheduling: fixed
    days:
      - monday
      - tuesday
      - thursday
    start_time: "19:00"
    duration_minutes: 90
    location: Bushidokan Martial Arts

  - id: yoga
    title: Yoga
    domain: fitness
    scheduling: preferred
    days:
      - wednesday
    duration_minutes: 60

  - id: monthly_finance_meeting
    title: Monthly finance meeting
    domain: finances
    recurrence: monthly
    weekday: sunday
    week_of_month: last
    duration_minutes: 60
    notes:
      - Review checking, savings, brokerage, and retirement balances
      - Review bills, debt, and the prior month's spending
      - Update net worth and identify upcoming large expenses
      - Choose one financial action for the next month
      - Link the newest finance worksheet after it is added to SamOS

training_plan:
  weight_sessions_per_week: 3
  duration_minutes: 90
  avoid_bjj_days: true
  avoid_yoga_days: true
  sessions:
    - name: Legs and abs
      notes:
        - Romanian deadlifts - 4 x 6-8
        - Hip thrusts - 4 x 8-10
        - Single-leg Romanian deadlifts - 3 x 8 each side
        - Hamstring curls - 3 x 12
        - Calf raises - 4 x 15
        - Tibialis raises - 3 x 15
        - "Mobility: 90/90 hips, couch stretch, thoracic rotations, world's greatest stretch, and a 60-second deep squat hold"
        - "Finish: 10-minute BJJ flow - shrimp, reverse shrimp, bridges, technical stand-ups, sit-throughs, sprawls, and Granby rolls"
    - name: Chest and shoulders
      notes:
        - Pike push-ups or handstand push-up progression - 4 x 8
        - Dips - 4 x 8-12
        - Leaning lateral raises - 5 x 15
        - Rear delt fly - 4 x 15
        - Hammer curls - 4 x 10
        - Incline dumbbell curls - 3 x 12
        - Rope pushdowns - 4 x 12
        - Farmer carries - 3 x 40 seconds
        - Towel pull-ups - 3 sets, stopping 1-2 reps before failure
        - "Finish: 10-minute BJJ flow - shrimp, reverse shrimp, bridges, technical stand-ups, sit-throughs, sprawls, and Granby rolls"
    - name: Back and arms
      notes:
        - Weighted pull-ups - 5 x 5
        - Bodyweight pull-ups - 3 sets, stopping 1-2 reps before failure
        - Chest-supported rows - 4 x 8-12
        - One-arm dumbbell rows - 3 x 10 each side
        - Face pulls - 4 x 20
        - Leaning lateral raises - 5 x 15
        - Dead hangs - 3 x 60 seconds
        - Hanging leg raises - 3 x 15
        - "Finish: 10-minute BJJ flow - shrimp, reverse shrimp, bridges, technical stand-ups, sit-throughs, sprawls, and Granby rolls"

preferences:
  week_starts_on: monday
  planning_horizon_days: 7
  calendar_horizon_days: 365
