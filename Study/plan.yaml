name: Chief Resident Study Plan
start: 2026-08-03
end: 2026-11-30
source_status: verified
source_note: General Surgery TWIS Schedule 2023-2024, weeks 7-24; dates normalized to 2026 and Thanksgiving kept on the actual holiday week.

goals:
  score_questions_per_pass: 2200
  score_passes: 2
  score_pass_1_due: 2026-09-30
  score_pass_2_due: 2026-11-30
  twis_passes: 1
  twis_due: 2026-11-30

daily_targets:
  weekday_score_questions: 35
  deep_study_score_questions: 60
  vacation_score_questions: 10
  call_score_questions: 5
  anki_minutes: 10
  twis_minutes: 30
  deep_study_day: saturday
  case_review_day: sunday

